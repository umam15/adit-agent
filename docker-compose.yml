# Menjalankan adit-agent + server adit dalam satu network, supaya
# ADIT_BASE_URL agent bisa pakai nama service adit tanpa perlu expose port
# adit ke luar sama sekali -- cuma adit-agent yang perlu publik-facing
# (buat menerima webhook dari Synology Chat).
#
# Semua nilai yang mungkin beda per mesin/deployment diatur lewat .env
# (lihat .env.example) -- diseragamkan dengan pola di adit-console/adit-chat
# (ADIT_SERVER_HOST/ADIT_SERVER_PORT/ADIT_SERVER_CONTEXT), plus variable
# khusus adit-agent sendiri (kredensial Synology, admin, dst).
#
# Jalankan dari folder ini: docker compose up --build

services:
  adit:
    build:
      context: ${ADIT_SERVER_CONTEXT}
    container_name: ${ADIT_SERVER_HOST}
    volumes:
      - ${ADIT_SERVER_CONTEXT}/checkpoints:/app/checkpoints
      - ${ADIT_SERVER_CONTEXT}/data:/app/data
    # TIDAK ada "ports:" di sini secara sengaja -- beda dari
    # adit-console/adit-chat, server cukup diakses adit-agent lewat network
    # internal docker compose, tidak perlu diekspos ke host/internet.

  agent:
    # "build" dipakai kalau menjalankan "docker compose up --build" (build
    # lokal dari source). "image" menunjuk ke image yang sama yang
    # dipublish otomatis oleh CI ke Docker Hub (lihat
    # docs/release-process.md) -- kalau TIDAK mau build lokal, jalankan
    # "docker compose pull agent" lalu "docker compose up" (tanpa --build)
    # supaya compose langsung pakai image publik ini alih-alih build.
    build: .
    image: endsho/adit-agent:${AGENT_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      # Dibangun dari ADIT_SERVER_HOST/PORT (variable yang sama dengan
      # adit-console/adit-chat) supaya satu source of truth. Ini override
      # baris ADIT_BASE_URL=http://localhost:8000 di .env -- baris itu cuma
      # dipakai kalau adit-agent dijalankan TANPA docker compose (langsung
      # terhubung ke adit yang jalan di host, bukan di network compose ini).
      ADIT_BASE_URL: http://${ADIT_SERVER_HOST}:${ADIT_SERVER_PORT}
    ports:
      - "${AGENT_PORT}:9000"   # publik-facing -- buat webhook Synology
    # TIDAK ada "depends_on" di sini secara sengaja -- "adit" cuma punya
    # "build:" (bukan image publik), dan depends_on toh cuma nunggu
    # kontainer dibuat, bukan servernya siap. Koneksi ke "adit" sudah
    # langsung lewat nama service (ADIT_BASE_URL di atas); kalau "adit"
    # belum siap saat agent start, request pertama akan gagal dengan pesan
    # error yang jelas (lihat app/adit_client.py) -- bukan silent hang.
