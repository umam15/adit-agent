name: Backfill Gitea Releases

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check and create missing releases from CHANGELOG.md
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          API="${GITEA_API_URL:-${{ github.api_url }}}/repos/${{ github.repository }}"
          versions_file=$(mktemp)
          notes_file=$(mktemp)
          response_file=$(mktemp)
          trap 'rm -f "$versions_file" "$notes_file" "$response_file"' EXIT

          grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' CHANGELOG.md \
            | sed -E 's/^## \[//; s/\].*$//' > "$versions_file" || true

          if [ ! -s "$versions_file" ]; then
            echo "::error::Tidak menemukan heading versi di CHANGELOG.md"
            exit 1
          fi

          while IFS= read -r version; do
            [ -n "$version" ] || continue
            tag="v${version}"

            status=$(curl -sS -o "$response_file" -w '%{http_code}' \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${API}/releases/tags/${tag}")

            if [ "$status" = "200" ]; then
              echo "Release $tag sudah ada, dilewati."
              continue
            fi

            if [ "$status" != "404" ]; then
              echo "::error::Gagal memeriksa release $tag, HTTP $status"
              cat "$response_file"
              exit 1
            fi

            awk -v ver="$version" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found == 1) exit
                if ($0 ~ ("\\[" ver "\\]")) { found = 1; next }
                next
              }
              /^\[[^]]+\]:/ { if (found == 1) exit }
              found == 1 { print }
            ' CHANGELOG.md > "$notes_file"

            sed -i '/./,$!d' "$notes_file"
            tac "$notes_file" | sed '/./,$!d' | tac > "${notes_file}.trimmed"
            mv "${notes_file}.trimmed" "$notes_file"

            BODY_JSON=$(jq -Rs . < "$notes_file")
            if [[ "$version" == *-* ]]; then
              is_prerelease=true
            else
              is_prerelease=false
            fi
            PAYLOAD=$(jq -n \
              --arg tag "$tag" \
              --arg name "$tag" \
              --arg target "${{ github.sha }}" \
              --argjson body "$BODY_JSON" \
              --argjson prerelease "$is_prerelease" \
              '{
                tag_name: $tag,
                name: $name,
                body: $body,
                target_commitish: $target,
                draft: false,
                prerelease: $prerelease
              }')

            echo "Release $tag belum ada, membuat release..."
            create_status=$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H 'Content-Type: application/json' \
              "${API}/releases" \
              -d "$PAYLOAD")

            cat "$response_file"
            if [ "$create_status" -ge 300 ]; then
              echo "::error::Gagal membuat release $tag, HTTP $create_status"
              exit 1
            fi
          done < "$versions_file"
